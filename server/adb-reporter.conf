# /etc/adb-reporter.conf, settings for the CGI receiver server/openwrt/adb
# outside OpenWrt. Optional, without it the defaults below apply. Read on
# every request, never sourced: one name=value per line, # starts a comment.
# Must be readable by the web server user, chmod 640 and chgrp to its group.

# Bearer token the phones send, empty accepts anyone who can reach the server
token=

# One JSON file per device, writable by the web server user
state_dir=/var/lib/adb-reporter

# Seconds without a report before a device is flagged stale
stale_after=900

# 1 allows GET requests without the token
open_get=0

# Shell command run when a device's ip:port changes, with ADB_DEVICE_ID,
# ADB_NAME, ADB_IP, ADB_PORT, ADB_CONNECT, ADB_PREVIOUS and ADB_SERIAL set.
# hook_always=1 also runs it on every heartbeat
hook=
hook_always=0
